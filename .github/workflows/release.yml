name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify version tag
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $version" >&2
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Verify app and disk image
        run: |
          codesign --verify --deep --strict ".build/release-app/Skill Manager.app"
          hdiutil verify dist/Skill-Manager-*.dmg

      - name: Publish GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.dmg \
              dist/*.sha256 \
              --verify-tag \
              --generate-notes \
              --title "Skill Manager $RELEASE_TAG"
          fi
