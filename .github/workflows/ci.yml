name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Validate metadata and scripts
        run: |
          plutil -lint Resources/Info.plist
          bash -n scripts/*.sh

      - name: Run tests
        run: swift test

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Smoke test standalone app
        run: ./scripts/smoke-test-app.sh

      - name: Verify app and disk image
        run: |
          codesign --verify --deep --strict ".build/release-app/Skill Manager.app"
          hdiutil verify dist/Skill-Manager-*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Skill-Manager-DMG
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
