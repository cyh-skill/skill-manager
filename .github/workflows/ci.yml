name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Smoke test standalone app
        run: ./scripts/smoke-test-app.sh

      - name: Verify app and disk image
        run: |
          codesign --verify --deep --strict ".build/release-app/Skill Manager.app"
          hdiutil verify dist/Skill-Manager-*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Skill-Manager-DMG
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
